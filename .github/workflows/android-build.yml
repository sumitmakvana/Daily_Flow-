name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
    tags: ["android-v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 7 / AGP 8.7 require JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # google-services.json is git-ignored (Firebase project operon-f0614). Store it as a
      # repository secret: GOOGLE_SERVICES_JSON = base64 of the file (or the raw JSON).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          f=mobile/android/app/google-services.json
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$f"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$f"
          fi
          jq -e '.project_info.project_id' "$f" >/dev/null || { echo "::error::google-services.json is invalid"; rm -f "$f"; exit 1; }

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operon-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
